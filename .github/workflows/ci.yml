name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow needs nothing but the source. Pinned explicitly so it stays
# read-only regardless of the account-level default.
permissions:
  contents: read

jobs:
  worker:
    name: lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: triage-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q

  compose:
    name: compose config + image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build the worker image
        run: docker build -t zammad-triage-worker:ci ./triage-worker
