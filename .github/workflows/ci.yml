name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow needs nothing but the source. Pinned explicitly so it stays
# read-only regardless of the account-level default.
permissions:
  contents: read

jobs:
  worker:
    name: lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: triage-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q

  compose:
    name: compose config + image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build the worker image
        run: docker build -t zammad-triage-worker:ci ./triage-worker
